name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BEND_NO_TELEMETRY: "1"
      CC: clang-19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install native compiler dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-19
      - name: Install pinned Bend
        run: |
          bash scripts/install-bend-ci.sh "$RUNNER_TEMP/bend"
          echo "$RUNNER_TEMP/bend/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Type check
        run: bun run check
      - name: Test native Bend and Pi integration
        run: bun run test
