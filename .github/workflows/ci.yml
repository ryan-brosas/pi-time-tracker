name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BEND_NO_TELEMETRY: "1"
      CC: clang-19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      # The published package supports Node >= 22.19.0; the artifact test runs on that floor.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.19.0'
      - name: Install native compiler dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-19
      - name: Install pinned Bend toolchain
        run: |
          bash scripts/install-bend-ci.sh "$RUNNER_TEMP/bend"
          echo "$RUNNER_TEMP/bend/bin" >> "$GITHUB_PATH"
          # The runner context is unavailable in job-level env, and the build and
          # proof steps need the pinned compiler source beside the binary.
          echo "BEND_SOURCE_DIR=$RUNNER_TEMP/bend/source" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Reject a stale generated Bend policy
        run: bun run build:check
      - name: Check the proof obligations
        run: bun run proof:check
      - name: Type check
        run: bun run check
      - name: Test Bend policy and Pi integration
        run: bun run test
      - name: Validate Pi package payload
        run: bun run pack:check
      - name: Verify the packaged artifact on the Node floor
        run: bun run pack:test
