name: Publish npm

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      BEND_NO_TELEMETRY: "1"
      CC: clang-19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Reject duplicate npm version
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "pi-time-tracker@$version" version >/dev/null 2>"$RUNNER_TEMP/npm-view-error"; then
            echo "pi-time-tracker@$version is already published" >&2
            exit 1
          elif ! grep -q 'E404' "$RUNNER_TEMP/npm-view-error"; then
            cat "$RUNNER_TEMP/npm-view-error" >&2
            exit 1
          fi
      - name: Install native compiler dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-19
      - name: Install pinned Bend
        run: |
          bash scripts/install-bend-ci.sh "$RUNNER_TEMP/bend"
          echo "$RUNNER_TEMP/bend/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Type check
        run: bun run check
      - name: Test native Bend and Pi integration
        run: bun run test
      - name: Validate Pi package payload
        run: bun run pack:check
      - name: Pack verified artifact and publish via npm OIDC
        run: |
          version=$(node -p "require('./package.json').version")
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npm publish "./pi-time-tracker-$version.tgz" --provenance --access public --ignore-scripts
