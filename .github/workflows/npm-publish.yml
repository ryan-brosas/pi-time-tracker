name: Publish npm and GitHub release

on:
  # Every main push is a release candidate. The plan job decides whether it is one,
  # so a push that is already published or older than the release skips instead of
  # republishing an immutable version.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  # Releases are never cancelled or interrupted; a newer push queues behind the
  # running one so its artifact and tag stay consistent with the commit it tested.
  cancel-in-progress: false
  queue: max

jobs:
  # Read-only. Resolves release eligibility and the version to ship; it never
  # stamps the checkout, tags, publishes or writes to the registry.
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Release tags in the full history decide the next version; a shallow
          # clone cannot see them.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Decide the release version
        id: version
        run: bun scripts/prepare-release.mjs

  publish:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.pack.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      artifact-id: ${{ steps.archive.outputs.artifact-id }}
    permissions:
      contents: read
      id-token: write
    env:
      BEND_NO_TELEMETRY: "1"
      CC: clang-19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      # The published package supports Node >= 22.19.0; every release gate and the
      # artifact probe run on that floor. npm OIDC is added later, only for publish.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      # The version is generated here rather than committed back to main, so a
      # release never needs a bot commit and the tag still names the tested source.
      - name: Stamp the release version and source commit
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: npm pkg set "version=$RELEASE_VERSION" "gitHead=$GITHUB_SHA" --ignore-scripts
      - name: Reject duplicate npm version
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "pi-time-tracker@$version" version >/dev/null 2>"$RUNNER_TEMP/npm-view-error"; then
            echo "pi-time-tracker@$version is already published" >&2
            exit 1
          elif ! grep -q 'E404' "$RUNNER_TEMP/npm-view-error"; then
            cat "$RUNNER_TEMP/npm-view-error" >&2
            exit 1
          fi
      - name: Install native compiler dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-19
      - name: Install pinned Bend toolchain
        run: |
          bash scripts/install-bend-ci.sh "$RUNNER_TEMP/bend"
          echo "$RUNNER_TEMP/bend/bin" >> "$GITHUB_PATH"
          # The runner context is unavailable in job-level env, and the build and
          # proof steps need the pinned compiler source beside the binary.
          echo "BEND_SOURCE_DIR=$RUNNER_TEMP/bend/source" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Reject a stale generated Bend policy
        run: bun run build:check
      - name: Check the proof obligations
        run: bun run proof:check
      - name: Type check
        run: bun run check
      - name: Test Bend policy and Pi integration
        run: bun run test
      - name: Validate Pi package payload
        run: bun run pack:check
      - name: Pack the release artifact once
        id: pack
        run: |
          version=$(node -p "require('./package.json').version")
          # Read the filename npm actually wrote; a rename or scope change must not leave
          # the artifact and every downstream reference pointing at a missing file.
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/npm-pack.json"
          tarball=$(node -p "require(process.env.RUNNER_TEMP + '/npm-pack.json')[0].filename")
          test -f "$RUNNER_TEMP/$tarball"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Verify the release artifact without a compiler
        env:
          TARBALL: ${{ runner.temp }}/${{ steps.pack.outputs.tarball }}
        run: bun run pack:test "$TARBALL"
      - name: Retain the verified artifact for the release job
        id: archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      # Node 24 provides the npm release that supports OIDC trusted publishing.
      # It is added after the artifact is verified so the probe keeps running on the
      # floor the package claims to support.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Publish the verified artifact via npm OIDC
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          RELEASE_VERSION: ${{ steps.pack.outputs.version }}
        run: |
          dist_tag=latest
          if [[ "$RELEASE_VERSION" == *-* ]]; then dist_tag=next; fi
          cd "$RUNNER_TEMP"
          npm publish "./$TARBALL" --tag "$dist_tag" --provenance --access public --ignore-scripts

  release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.publish.outputs.artifact-id }}
          path: ${{ runner.temp }}/release
          merge-multiple: true
          digest-mismatch: error
      - name: Create the GitHub release and attach the published package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_TARBALL: ${{ runner.temp }}/release/${{ needs.publish.outputs.tarball }}
        run: bash scripts/github-release.sh
